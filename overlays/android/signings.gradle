// Loaded through upstream's signing configuration hook.
android {
    signingConfigs {
        siyuanConfig {
            storeFile = rootProject.file('keystore/siyuan.jks')
            storePassword = System.getenv('KEYSTORE_PASSWORD')
            keyAlias = 'siyuan'
            keyPassword = System.getenv('KEYSTORE_PASSWORD')
        }
    }
    defaultConfig {
        resValue 'string', 'app_package_name', 'org.b3log.siyuan'
    }
    productFlavors {
        appdev {
            ndk {
                abiFilters = ['arm64-v8a']
            }
            applicationId = 'com.appdev.siyuan'
            buildConfigField 'String', 'CHANNEL', '"appdev"'
            resValue 'string', 'app_name', 'SiYuan'
            resValue 'string', 'app_package_name', 'com.appdev.siyuan'
        }
    }
}
