name: Source transformation tools
description: Install pinned parsers for structural source integration
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: stable
        cache: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - shell: bash
      run: npm ci --ignore-scripts --no-audit --no-fund --prefix "${{ github.action_path }}/../../../patches/sftp/transforms"
