name: Test SFTP patch

on:
  push:
    branches: [master]
    paths:
      - 'overlays/**'
      - 'patches/**'
      - 'scripts/prepare-sftp-source.sh'
      - '.github/workflows/test-sftp.yml'
  pull_request:
    paths:
      - 'overlays/**'
      - 'patches/**'
      - 'scripts/prepare-sftp-source.sh'
      - '.github/workflows/test-sftp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [v3.8.3, v3.8.4]
    steps:
      - uses: actions/checkout@v4
      - name: Apply patches to supported SiYuan release
        env:
          VERSION: ${{ matrix.version }}
        run: bash scripts/prepare-sftp-source.sh "$VERSION" "$RUNNER_TEMP/siyuan-sftp-test"
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.temp }}/siyuan-sftp-test/kernel/go.mod
          cache-dependency-path: ${{ runner.temp }}/siyuan-sftp-test/kernel/go.sum
      - name: Test SFTP and DejaVu backup lifecycle
        working-directory: ${{ runner.temp }}/siyuan-sftp-test/kernel
        run: go test -race ./sftpcloud
