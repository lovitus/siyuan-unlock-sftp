name: Verify published SFTP container
on:
  workflow_run:
    workflows: ['Build and verify container review', 'Build and verify SFTP review']
    types: [completed]
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
      delayed:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      commandFix:
        description: Test CMD serve in a local derivative of the published image (no publishing)
        type: boolean
        default: false
      delayed:
        description: Also exercise delayed I/O with a 16 MiB asset
        type: boolean
        default: true
      revision:
        description: Full patch commit of the published review image
        required: true
        default: a54ed858544f3d9fd625c62e09db25914f55b837
        type: string
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ (inputs.delayed || github.event_name == 'workflow_run') && fromJSON('["normal", "delayed-io"]') || fromJSON('["normal"]') }}
    steps:
      - name: Require a successful image build before automatic verification
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN/jobs" --jq '.jobs[] | select(.name == "build / build" or .name == "docker / build") | .conclusion' | grep -qx success
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull and verify published image
        env:
          REVISION: ${{ inputs.revision || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]]
          image="ghcr.io/lovitus/siyuan-unlock-sftp:review-$REVISION"
          docker pull "$image"
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")" = "$REVISION"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
          echo "SFTP_REVIEW_IMAGE=$digest" >> "$GITHUB_ENV"
      - name: Isolate default command fix without recompiling the kernel
        if: inputs.commandFix == true
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/empty-context"
          printf 'FROM %s\nCMD ["serve"]\n' "$SFTP_REVIEW_IMAGE" | docker build -t sftp-command-fix-validation -f - "$RUNNER_TEMP/empty-context"
          echo "SFTP_REVIEW_BASE_IMAGE=$SFTP_REVIEW_IMAGE" >> "$GITHUB_ENV"
          echo "SFTP_REVIEW_IMAGE=sftp-command-fix-validation" >> "$GITHUB_ENV"
      - name: Verify default image command and workspace ownership
        if: matrix.profile == 'normal'
        run: python scripts/validation/verify_container_default.py --image "$SFTP_REVIEW_IMAGE" --report "$RUNNER_TEMP/sftp-container-default.json"
      - name: Exercise original entrypoint, SFTP sync, backup and restart
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          delay_ms=0
          asset_mib=0
          if [[ "$PROFILE" = delayed-io ]]; then delay_ms=80; asset_mib=16; fi
          python -m pip install asyncssh
          python scripts/validation/asyncssh_server.py --directory "$RUNNER_TEMP/sftp-server" --io-delay-ms "$delay_ms" > "$RUNNER_TEMP/sftp-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            test ! -f "$RUNNER_TEMP/sftp-server/sftp.json" || break
            kill -0 "$server_pid"
            sleep 1
          done
          python scripts/validation/verify_sftp_artifact.py \
            --image "$SFTP_REVIEW_IMAGE" --asset-mib "$asset_mib" \
            --sftp-config "$RUNNER_TEMP/sftp-server/sftp.json" \
            --output "$RUNNER_TEMP/sftp-container-validation"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-validation-${{ matrix.profile }}
          path: |
            ${{ runner.temp }}/sftp-container-validation/report.json
            ${{ runner.temp }}/sftp-container-validation/*.log
            ${{ runner.temp }}/sftp-server.log
            ${{ runner.temp }}/sftp-container-default.json
            ${{ runner.temp }}/sftp-container-default.log
