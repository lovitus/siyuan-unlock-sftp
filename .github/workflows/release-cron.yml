name: Track upstream releases

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/**'
      - 'patches/**'
      - 'overlays/**'
      - 'scripts/*sftp*'
      - 'scripts/*release*'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: upstream-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.release.outputs.pending }}
      version: ${{ steps.release.outputs.version }}
      package_manager: ${{ steps.release.outputs.package_manager }}
    steps:
      - uses: actions/checkout@v4
      - name: Test release detection
        run: python3 scripts/test-release-tracking.py
      - name: Check upstream published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-upstream-release.py

  desktop:
    needs: check
    if: needs.check.outputs.pending == 'true'
    uses: ./.github/workflows/desktop-release.yml
    with:
      version: ${{ needs.check.outputs.version }}
      packageManager: ${{ needs.check.outputs.package_manager }}
    secrets: inherit

  android:
    needs: check
    if: needs.check.outputs.pending == 'true'
    uses: ./.github/workflows/release-android.yml
    with:
      version: ${{ needs.check.outputs.version }}
      packageManager: ${{ needs.check.outputs.package_manager }}
    secrets: inherit

  ios:
    needs: check
    if: needs.check.outputs.pending == 'true'
    uses: ./.github/workflows/release-ios.yml
    with:
      version: ${{ needs.check.outputs.version }}
      packageManager: ${{ needs.check.outputs.package_manager }}
    secrets: inherit

  docker:
    needs: check
    if: needs.check.outputs.pending == 'true'
    uses: ./.github/workflows/release-docker.yml
    with:
      version: ${{ needs.check.outputs.version }}
    secrets: inherit

  publish:
    needs: [check, desktop, android, ios, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Promote successful image to latest
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create --tag "$image:latest" "$image:$VERSION"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
