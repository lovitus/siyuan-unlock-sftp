name: Track upstream releases

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'patches/**'
      - 'overlays/**'
      - 'scripts/*sftp*'
      - 'scripts/*release*'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: upstream-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      pending: ${{ steps.release.outputs.pending }}
      version: ${{ steps.release.outputs.version }}
      package_manager: ${{ steps.release.outputs.package_manager }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      ios_sha: ${{ steps.release.outputs.ios_sha }}
      patch_fingerprint: ${{ steps.release.outputs.patch_fingerprint }}
      preflight_fingerprint: ${{ steps.release.outputs.preflight_fingerprint }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-source-tools
      - name: Test release detection
        run: |
          python3 scripts/test-release-tracking.py
          python3 scripts/test-release-state.py
          python3 scripts/test-release-upload.py
          GO111MODULE=off go test ./patches/sftp/transforms
          node patches/sftp/transforms/frontend.test.mjs
      - name: Check upstream published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-upstream-release.py

  preflight:
    needs: check
    if: needs.check.outputs.pending == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-source-tools
      - name: Verify source patches before starting platform builds
        env:
          VERSION: ${{ needs.check.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ needs.check.outputs.source_sha }}
          PATCH_FINGERPRINT: ${{ needs.check.outputs.preflight_fingerprint }}
        run: python3 scripts/release-preflight.py
      - name: Set up upstream Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.temp }}/sftp-desktop/kernel/go.mod
          cache-dependency-path: ${{ runner.temp }}/sftp-desktop/kernel/go.sum
      - name: Test SFTP and compile kernel before starting platform builds
        env:
          VERSION: ${{ needs.check.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ needs.check.outputs.source_sha }}
          PATCH_FINGERPRINT: ${{ needs.check.outputs.preflight_fingerprint }}
        run: python3 scripts/release-preflight.py --compile

  desktop:
    needs: [check, preflight]
    if: needs.check.outputs.pending == 'true'
    uses: ./.github/workflows/desktop-release.yml
    with:
      version: ${{ needs.check.outputs.version }}
      packageManager: ${{ needs.check.outputs.package_manager }}
    secrets: inherit

  android:
    needs: [check, preflight]
    if: needs.check.outputs.pending == 'true'
    uses: ./.github/workflows/release-android.yml
    with:
      version: ${{ needs.check.outputs.version }}
      packageManager: ${{ needs.check.outputs.package_manager }}
    secrets: inherit

  ios:
    needs: [check, preflight]
    if: needs.check.outputs.pending == 'true'
    uses: ./.github/workflows/release-ios.yml
    with:
      version: ${{ needs.check.outputs.version }}
      packageManager: ${{ needs.check.outputs.package_manager }}
      sourceSha: ${{ needs.check.outputs.ios_sha }}
    secrets: inherit

  docker:
    needs: [check, preflight]
    if: needs.check.outputs.pending == 'true'
    uses: ./.github/workflows/release-docker.yml
    with:
      version: ${{ needs.check.outputs.version }}
    secrets: inherit

  publish:
    needs: [check, desktop, android, ios, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Promote successful image to latest
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create --tag "$image:latest" "$image:$VERSION"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          RELEASE_ID: ${{ needs.check.outputs.release_id }}
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -f tag_name="$VERSION" -F draft=false -f make_latest=true --silent
