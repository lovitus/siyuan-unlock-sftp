name: CD For SiYuan Unlock
on:
  workflow_call:
    inputs:
      target:
        description: "Artifact suffix to rebuild, or all"
        type: string
        default: all
      artifactsOnly:
        description: "Store build artifacts without updating a release"
        type: boolean
        default: false
      version:
        required: true
        type: string
      packageManager:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      target:
        description: "Artifact suffix to rebuild, or all"
        type: choice
        default: all
        options: [all, linux.tar.gz, linux.AppImage, linux-arm64.tar.gz, mac.dmg, mac-arm64.dmg, win.exe]
      artifactsOnly:
        description: "Store build artifacts without updating a release"
        type: boolean
        default: false
      version:
        description: "release version/tag"
        required: true
      packageManager:
        description: "pnpm@x.x.x"
        required: true

defaults:
  run:
    shell: bash

permissions:
  contents: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.select.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: select
        env:
          TARGET: ${{ inputs.target || 'all' }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          with open('scripts/desktop-release-matrix.json') as source:
              matrix = json.load(source)
          if os.environ['TARGET'] != 'all':
              matrix['config'] = [item for item in matrix['config'] if item['suffix'] == os.environ['TARGET']]
              if len(matrix['config']) != 1:
                  raise SystemExit('Unknown desktop build target')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('value=' + json.dumps(matrix) + '\n')
          PYTHON
  build:
    needs: matrix
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.value) }}

    steps:

      - name: Validate release inputs
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PACKAGE_MANAGER: ${{ inputs.packageManager }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$PACKAGE_MANAGER" =~ ^pnpm@[0-9]+\.[0-9]+\.[0-9]+(\+sha[0-9]+\.[a-fA-F0-9]+)?$ ]]

      - uses: actions/checkout@v4
        with:
          path: siyuan-note

      - uses: ./siyuan-note/.github/actions/setup-source-tools

      - name: clone origin and apply patches
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          workspace="${{ github.workspace }}"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            workspace="$(cygpath -u "${workspace}")"
          fi

          mkdir -p "${workspace}/go"
          cd "${workspace}/siyuan-note/"

          bash "${workspace}/siyuan-note/scripts/prepare-sftp-source.sh" "$RELEASE_VERSION" siyuan
          cd siyuan
          git status

      - name: Set up Cross Compilation Toolchains for Linux
        if: contains( matrix.config.goos, 'linux')
        run: |
          sudo mkdir -p /usr/local/musl
      
          if [ "${{ matrix.config.goarch }}" = "amd64" ]; then
            wget https://github.com/appdev/musl-archive/releases/download/latest/x86_64-linux-musl-cross.tgz
            sudo tar -xzf x86_64-linux-musl-cross.tgz -C /usr/local/musl
          elif [ "${{ matrix.config.goarch }}" = "arm64" ]; then
            # OCR uses the upstream glibc runtime; the kernel keeps musl below.
            sudo apt-get update
            sudo apt-get install -y gcc-aarch64-linux-gnu
            wget https://github.com/appdev/musl-archive/releases/download/latest/aarch64-linux-musl-cross.tgz
            sudo tar -xzf aarch64-linux-musl-cross.tgz -C /usr/local/musl
          fi

      - name: Set up MingGW
        uses: msys2/setup-msys2@v2
        if: contains( matrix.config.goos, 'windows')
        with:
          install: p7zip mingw-w64-x86_64-lua

      - name: Set up TDM-GCC
        shell: pwsh
        run: msys2 -c "bash siyuan-note/siyuan/scripts/get-tdm-gcc.sh tdm https://github.com/jmeubank/tdm-gcc/releases/download/v10.3.0-tdm-1/tdm-gcc-10.3.0.exe" && echo "CC=${{ github.workspace }}/tdm/bin/gcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        if: contains( matrix.config.goarch, '386')
        working-directory: ${{ github.workspace }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ github.workspace }}/siyuan-note/siyuan/kernel/go.mod
          cache-dependency-path: "**/*.sum"
      - run: go version
      - name: Test SFTP provider
        run: go test ./sftpcloud
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/kernel

      - name: Set up goversioninfo
        run: go get github.com/josephspurrier/goversioninfo/cmd/goversioninfo && go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo
        if: contains( matrix.config.goos, 'windows')
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/kernel
        env:
          GO111MODULE: on
          CGO_ENABLED: 1
          GOOS: ${{ matrix.config.goos }}
          GOPATH: ${{ github.workspace }}/go
          GOARCH: ${{ matrix.config.goarch }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Node pnpm
        run: npm install -g "${PACKAGE_MANAGER}"
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/app
        env:
          PACKAGE_MANAGER: ${{ inputs.packageManager }}

      - name: Install Node Dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/app

      - name: Building UI
        run: pnpm run build
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/app

      - name: Generate Icon Resource and Properties/Version Info For Windows
        shell: pwsh
        run: ${{ github.workspace }}\go\${{ matrix.config.gobin }}\goversioninfo -platform-specific=true -icon="resource\icon.ico" -manifest="resource\goversioninfo.exe.manifest"
        if: contains( matrix.config.goos, 'windows')
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/kernel

      - name: Clean Build Directories
        if: contains( matrix.config.goos, 'linux')
        run: |
          rm -rf app/build
          rm -rf app/kernel-linux
          rm -rf app/kernel-linux-arm64
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan

      - name: Building Kernel
        run: go build ${{ matrix.config.build_mode }} --tags "fts5 sqlcipher" -o "${{ matrix.config.kernel_path }}" -v -ldflags "${{ matrix.config.build_args }}"
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/kernel
        env:
          GO111MODULE: on
          CGO_ENABLED: 1
          GOOS: ${{ matrix.config.goos }}
          GOPATH: ${{ github.workspace }}/go
          GOARCH: ${{ matrix.config.goarch }}
          GOPROXY: https://proxy.golang.org,direct
          CC: ${{ runner.os == 'Linux' && format('/usr/local/musl/{0}', matrix.config.cc_path) || '' }}

      - name: Verify Linux kernel is static PIE
        if: contains(matrix.config.goos, 'linux')
        shell: bash
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/kernel
        run: |
          set -euo pipefail
          kernel_path="${{ matrix.config.kernel_path }}"
          file "${kernel_path}"
          build_info="$(go version -m "${kernel_path}")"
          program_headers="$(readelf -lW "${kernel_path}")"
          dynamic_section="$(readelf -dW "${kernel_path}" 2>/dev/null || true)"
          printf '%s\n' "${build_info}"
          printf '%s\n' "${program_headers}"
          printf '%s\n' "${dynamic_section}"

          if grep -Fq ' INTERP ' <<<"${program_headers}"; then
            echo "::error::Linux kernel contains an ELF interpreter"
            exit 1
          fi
          if grep -Fq '(NEEDED)' <<<"${dynamic_section}"; then
            echo "::error::Linux kernel contains dynamic dependencies"
            exit 1
          fi
          grep -F $'build\t-buildmode=pie' <<<"${build_info}"
          grep -F -- '-extldflags -static-pie' <<<"${build_info}"

      - name: Building Electron
        run: pnpm run ${{ matrix.config.electron_args }}
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/app

      - name: Upload Electron App to existing draft
        if: ${{ !inputs.artifactsOnly }}
        shell: bash
        working-directory: siyuan-note/siyuan/app/build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SUFFIX: ${{ matrix.config.suffix }}
        run: python3 ../../../scripts/upload-release-assets.py "$VERSION" siyuan-*-"$SUFFIX"

      - name: Record build source
        if: inputs.artifactsOnly
        shell: bash
        env:
          PATCH_COMMIT: ${{ github.sha }}
          SOURCE_TAG: ${{ inputs.version }}
        run: |
          printf 'patch_commit=%s\nsource_tag=%s\nrun_id=%s\n' "$PATCH_COMMIT" "$SOURCE_TAG" "$GITHUB_RUN_ID" > "$GITHUB_WORKSPACE/source-revision.txt"

      - name: Save review build
        if: inputs.artifactsOnly
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.config.suffix }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ github.workspace }}/siyuan-note/siyuan/app/build/siyuan-*-${{ matrix.config.suffix }}
            ${{ github.workspace }}/source-revision.txt
