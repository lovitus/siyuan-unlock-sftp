name: Verify published macOS SFTP package
on:
  workflow_run:
    workflows: ['Build and verify SFTP review']
    types: [completed]
  workflow_dispatch:
    inputs:
      buildRun:
        description: Review build containing desktop-mac-arm64.dmg
        type: string
        required: true
      revision:
        description: Exact source revision of the package
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_branch == 'master')
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download, mount and verify packaged native kernel
        env:
          BUILD_RUN: ${{ inputs.buildRun || github.event.workflow_run.id }}
          REVISION: ${{ inputs.revision || github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[0-9]+$ && "$REVISION" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(uname -m)" == arm64 ]]
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name desktop-mac-arm64.dmg --dir "$RUNNER_TEMP/package"
          grep -qx "patch_commit=$REVISION" "$RUNNER_TEMP/package/source-revision.txt"
          dmg=$(find "$RUNNER_TEMP/package" -name '*.dmg' -type f)
          test -f "$dmg"
          shasum -a 256 "$dmg" > "$RUNNER_TEMP/package-sha256.txt"
          cp "$RUNNER_TEMP/package/source-revision.txt" "$RUNNER_TEMP/source-revision.txt"
          mount="$RUNNER_TEMP/sftp-mount"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount"
          server_pid=''
          trap 'if [[ -n "$server_pid" ]]; then kill "$server_pid" 2>/dev/null || true; fi; hdiutil detach "$mount" || true' EXIT
          python -m pip install asyncssh
          python scripts/validation/asyncssh_server.py --directory "$RUNNER_TEMP/sftp-server" > "$RUNNER_TEMP/sftp-server.log" 2>&1 &
          server_pid=$!
          for _ in $(seq 1 60); do
            test ! -f "$RUNNER_TEMP/sftp-server/sftp.json" || break
            kill -0 "$server_pid"
            sleep 1
          done
          resources="$mount/SiYuan.app/Contents/Resources"
          python scripts/validation/verify_sftp_artifact.py \
            --kernel "$resources/kernel/SiYuan-Kernel" --resources "$resources" \
            --sftp-config "$RUNNER_TEMP/sftp-server/sftp.json" \
            --output "$RUNNER_TEMP/sftp-macos-validation"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-runtime-validation
          path: |
            ${{ runner.temp }}/sftp-macos-validation/report.json
            ${{ runner.temp }}/sftp-macos-validation/*.log
            ${{ runner.temp }}/sftp-server.log
            ${{ runner.temp }}/package-sha256.txt
            ${{ runner.temp }}/source-revision.txt
