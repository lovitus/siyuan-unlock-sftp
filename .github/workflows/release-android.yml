name: release-android

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      packageManager:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "release version/tag"
        required: true
      packageManager:
        description: "pnpm@x.x.x"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.config.os }}
    strategy:
      matrix:
        config:
          - os: ubuntu-22.04
            kernel_path: "../../../siyuan-android/app/libs/kernel.aar"

    steps:

      - uses: actions/checkout@v4
        with:
          path: siyuan-note

      - name: clone origin and apply patches
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ${{ github.workspace }}/go
          cd ${{ github.workspace }}/siyuan-note/

          bash "${{ github.workspace }}/siyuan-note/scripts/prepare-sftp-source.sh" "$RELEASE_VERSION" siyuan
          cd siyuan
          git status

          cd ..

          git clone --branch ${{ inputs.version }} --depth=1 https://github.com/siyuan-note/siyuan-android.git
          cd siyuan-android

          git apply --ignore-whitespace --verbose ${{ github.workspace }}/siyuan-note/patches/siyuan-android/debug-build.patch
          git apply --ignore-whitespace --verbose ${{ github.workspace }}/siyuan-note/patches/siyuan-android/dual-package.patch

          mkdir -p app/src/main/assets/
          mkdir -p app/libs/

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ github.workspace }}/siyuan-note/siyuan/kernel/go.mod
          cache-dependency-path: "**/*.sum"
      - run: go version
      - name: Test SFTP provider
        run: go test ./sftpcloud
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/kernel

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Node pnpm
        run: npm install -g ${{ inputs.packageManager }}
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/app

      - name: Install Node Dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/app

      - name: Building UI
        run: pnpm run build
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/app

      - name: gomobile
        working-directory: ${{ github.workspace }}/go
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init

      - name: Set up java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Building Android Kernel
        run: |
          gomobile bind --tags "fts5 sqlcipher" -androidapi 21 -target='android/arm64' -ldflags '-s -w' -v -o "${{ matrix.config.kernel_path }}" ./
          ls -la "${{ matrix.config.kernel_path }}"
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/kernel/mobile
        env:
          GO111MODULE: on
          CGO_ENABLED: 1

      - name: android assets
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan/app/
        run: |
          zip -r ${{ github.workspace }}/siyuan-note/siyuan-android/app/src/main/assets/app.zip ./appearance ./guide ./stage ./changelogs

      - name: Decode Keystore
        id: decode_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: "siyuan.jks"
          fileDir: ${{ github.workspace }}/siyuan-note/siyuan-android/keystore
          encodedString: ${{ secrets.KEYSTORE }}

      - name: Building Android
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan-android
        run: |
          chmod 777 ./gradlew
          ./gradlew :app:assembleGoogleplayRelease :app:assembleAppdevRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Verify Android package IDs
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan-android
        run: |
          original_apk=$(find app/build/outputs/apk/googleplay/release -maxdepth 1 -type f -name 'siyuan-*.apk' -print -quit)
          appdev_apk=$(find app/build/outputs/apk/appdev/release -maxdepth 1 -type f -name 'siyuan-*.apk' -print -quit)
          aapt=$(find "${ANDROID_HOME}/build-tools" -type f -name aapt -print | sort -V | tail -n 1)

          test -n "${original_apk}" && test -n "${appdev_apk}" && test -n "${aapt}"
          "${aapt}" dump badging "${original_apk}" | grep -Fq "package: name='org.b3log.siyuan'"
          "${aapt}" dump badging "${appdev_apk}" | grep -Fq "package: name='com.appdev.siyuan'"

      - name: Upload Android packages
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan-android
        run: |
          set -euo pipefail
          original=(app/build/outputs/apk/googleplay/release/siyuan-*.apk)
          appdev=(app/build/outputs/apk/appdev/release/siyuan-*.apk)
          test "${#original[@]}" -eq 1 && test -f "${original[0]}"
          test "${#appdev[@]}" -eq 1 && test -f "${appdev[0]}"
          cp "${original[0]}" "siyuan-unlock-$VERSION-android-arm64.apk"
          cp "${appdev[0]}" "siyuan-unlock-$VERSION-android-arm64-appdev.apk"
          gh release upload "$VERSION" "siyuan-unlock-$VERSION-android-arm64.apk" "siyuan-unlock-$VERSION-android-arm64-appdev.apk" --repo "$GITHUB_REPOSITORY" --clobber
